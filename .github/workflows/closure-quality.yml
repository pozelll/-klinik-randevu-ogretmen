name: Ogretmen kapanis - kalite olcumleri
on:
  push:
    branches: ['fix/ogretmen-kapanis', 'main']
  pull_request:
    paths: ['index.html', 'src/**', 'tests/**', 'hafta09/tools/**', '.github/workflows/closure-quality.yml']
permissions:
  contents: read
jobs:
  measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Is kurallari regresyonu
        run: node --test tests/*.test.cjs
      - name: Panel dogrulayici regresyonu
        run: python -m unittest discover -s hafta09/tools -p test_surum_kontrol.py -v
      - name: Gercek Gitflow deneyi
        run: python hafta09/tools/gitflow_lab.py
      - name: Tarayici ve yerel klavye araclari
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot
      - name: Kaynak uygulama davranisi
        run: python tests/browser_smoke.py
      - name: Performans ve veri olcegi
        run: python tests/performance_checks.py
      - name: Gercek klavye ve native onay penceresi
        run: xvfb-run -a -s '-screen 0 1280x1000x24' python tests/keyboard_acceptance.py --native-dialog --evidence-dir "$RUNNER_TEMP/klavye-kanit" --embed-native-screenshots
