name: Klinik - kurallar ve tarayici
on:
  push:
    branches: ['main', 'test/h6-karar-tablosu', 'feat/h7-saat-secimi-yardimi', 'release/h8-surum-adayi', 'fix/ogretmen-kapanis']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Calisma kopyasi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Is kurallari ve veri erisimi - 30 test
        run: node --test --test-reporter=tap tests/*.test.cjs
      - name: Tarayici test aracini kur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Chromium - 14 senaryo
        run: python tests/browser_smoke.py
      - name: Paket - 8 uretim ve butunluk kontrolu
        run: python scripts/check_candidate.py --profile h9
      - name: Dagitim paketini yeniden uret, karsilastir ve ayikla
        run: |
          python scripts/build_candidate.py build --profile h9 --output "$RUNNER_TEMP/h9-built.zip"
          cmp "$RUNNER_TEMP/h9-built.zip" hafta09/dagitim/Klinik_Randevu_0.3.0-rc.2.zip
          python scripts/build_candidate.py verify --profile h9 hafta09/dagitim/Klinik_Randevu_0.3.0-rc.2.zip
          python scripts/build_candidate.py extract --profile h9 hafta09/dagitim/Klinik_Randevu_0.3.0-rc.2.zip --target "$RUNNER_TEMP/h9-package"
      - name: Ayiklanmis pakette Chromium - 14 senaryo
        run: python tests/browser_smoke.py --app-dir "$RUNNER_TEMP/h9-package"
