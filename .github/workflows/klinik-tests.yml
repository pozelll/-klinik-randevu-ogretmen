name: Klinik - kurallar ve tarayici
on:
  push:
    branches: ['test/h6-karar-tablosu']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Calisma kopyasi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Is kurallari ve veri erisimi - 30 test
        run: node --test --test-reporter=tap tests/*.test.cjs
      - name: Tarayici test aracini kur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Chromium - 9 senaryo
        run: python tests/browser_smoke.py
